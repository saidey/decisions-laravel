name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '11.*'
            testbench: '^9.0'
            php: '8.2'
          - laravel: '12.*'
            testbench: '^10.0'
            php: '8.2'
          - laravel: '13.*'
            testbench: '^11.0'
            php: '8.3'
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pdo_sqlite, xml, xmlwriter, zlib
          coverage: none
          tools: composer:v2
      - name: Install matching Laravel and Testbench
        run: |
          composer require --dev --no-update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction
      - name: Test
        run: vendor/bin/phpunit
      - name: Check formatting
        run: vendor/bin/pint --test src config tests
